; PlatformIO Project Configuration File for BeetleBoard
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
monitor_filters = default, time

build_flags = 
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

; Fallback environment using generic ESP32-C6 devkit if seeed_xiao_esp32c6 is not yet in older PlatformIO cores
[env:esp32-c6-generic]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = default, time

build_flags = 
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
